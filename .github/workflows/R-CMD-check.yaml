# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # TEMPORARY: binaries of mixtime 0.5.0 (PPM, and CRAN's own) were built
      # against vecvec 1.4.0 and fail with vecvec 1.5.0 ("`x` is not a vecvec
      # base vector"). Rebuild mixtime from source until a new mixtime release
      # replaces those binaries, then remove this step.
      - name: Rebuild mixtime from source
        run: install.packages("mixtime", type = "source", repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
